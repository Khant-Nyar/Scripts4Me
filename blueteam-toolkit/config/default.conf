# Blue Team Toolkit Configuration
# ==================================

# Detection Thresholds
THRESHOLD_BRUTE_FORCE=10
THRESHOLD_SCANNER=50
THRESHOLD_ENUMERATION=30
THRESHOLD_SQLI=1
THRESHOLD_RCE=1
THRESHOLD_XSS=1
THRESHOLD_PATH_TRAVERSAL=1

# Minimum Severity Level (CRITICAL, HIGH, MEDIUM, LOW, INFO)
MIN_SEVERITY=LOW

# Enable/Disable Detectors
ENABLE_SQLI=true
ENABLE_RCE=true
ENABLE_BACKDOOR=true
ENABLE_BRUTEFORCE=true
ENABLE_XSS=true
ENABLE_PATH_TRAVERSAL=true
ENABLE_LOG4SHELL=true
ENABLE_SCANNER=true
ENABLE_FILE_DISCLOSURE=true
ENABLE_ENUMERATION=true

# Webshell Patterns (comma-separated)
WEBSHELL_PATTERNS=c99,r57,shell,webshell,b374k,anj

# Suspicious User Agents (comma-separated)
SUSPICIOUS_USER_AGENTS=sqlmap,nikto,nmap,masscan,gobuster,dirbuster,hydra,medusa

# Log Format
LOG_FORMAT=combined
IP_REGEX=^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+

# Output Options
OUTPUT_JSON=false
OUTPUT_CSV=false
VERBOSE=false
QUIET=false
TOP_COUNT=20
